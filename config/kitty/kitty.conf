# ------------------------------------------------------------
# SHUNYA Kitty
# ------------------------------------------------------------

# Typography
font_family family="Source Code Pro" style=Medium
bold_font family="Source Code Pro" style=Semibold
italic_font auto
bold_italic_font auto
font_size 13.0

# Nerd Font symbols
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono
# Fish is the default shell inside Kitty.
shell /usr/bin/fish

# ------------------------------------------------------------
# Window
# ------------------------------------------------------------

# Compact breathing room.
window_padding_width 8
placement_strategy center

# Text remains fully opaque; only the terminal background blends.
# Opacity is generated by shunya-theme per mode.
dynamic_background_opacity yes

# Keep all text crisp.
inactive_text_alpha 1.0

# Hyprland owns the outer window.
hide_window_decorations yes

# ------------------------------------------------------------
# Cursor
# ------------------------------------------------------------

cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0

# Retain Kitty shell integration without forcing a beam cursor.
shell_integration no-cursor

# ------------------------------------------------------------
# Tabs
# ------------------------------------------------------------

tab_bar_edge top
tab_bar_style separator
tab_separator "  "
tab_bar_align center

# Hide the tab bar until there are actually multiple tabs.
tab_bar_min_tabs 2
tab_bar_show_new_tab_button no

active_tab_font_style bold
inactive_tab_font_style normal

# ------------------------------------------------------------
# Behaviour
# ------------------------------------------------------------

confirm_os_window_close 0
enable_audio_bell no

# ------------------------------------------------------------
# SHUNYA generated palette
# ------------------------------------------------------------

include shunya-theme.conf
