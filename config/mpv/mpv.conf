# SHUNYA mpv

# Resume playback position
save-position-on-quit=yes

# Clean, minimal player
osc=yes
osd-bar=yes
border=yes

# Sensible audio
volume-max=100

# Hardware decoding on this Intel GPU
hwdec=vaapi
hwdec-codecs=h264,mpeg2video,vc1

# Preserve correct aspect ratio
keepaspect=yes

# Screenshots
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
