# SHUNYA lockscreen foundation
# Temporary styling; shared theme will follow.

background {
    monitor =
    color = rgba(171a20ff)
}

label {
    monitor =
    text = $TIME
    font_family = Source Code Pro
    font_size = 64
    color = rgba(edf1f7ff)
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    outer_color = rgba(536b8eff)
    inner_color = rgba(232833ff)
    font_color = rgba(edf1f7ff)
    font_family = Source Code Pro
    placeholder_text = Password
    fade_on_empty = false
    rounding = 8
    position = 0, -30
    halign = center
    valign = center
}
